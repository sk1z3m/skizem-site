name = "skizem-site"
main = "src/index.js"
compatibility_date = "2025-09-01"

# skizem.com and projects.skizem.com are attached as Custom Domains in the
# Cloudflare dashboard (Worker > Settings > Domains & Routes), not here.

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# The Worker runs first so it can map projects.skizem.com/* to public/projects/*
run_worker_first = true
