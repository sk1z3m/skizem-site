const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(x){const s=x<0?'−':'';x=Math.abs(x);return s+(x>=999.5?'$'+(x/1000).toFixed(2)+'B':x>=0.995?'$'+x.toFixed(x>=100?0:1)+'M':'$'+Math.round(x*1000)+'K');}
const sgn=x=>(x>=0?'+':'')+money(x);
const cls=x=>x>=0?'pos':'neg';
function globalMult(t){let m=1;for(const e of EVENTS)if(t>=e.from&&t<=e.to&&e.global)m*=e.global;return m;}
function cityMult(t,c){let m=1;for(const e of EVENTS)if(t>=e.from&&t<=e.to&&e.city===c)m*=e.mult;return m;}
function fuelMult(t){let m=1;for(const e of EVENTS)if(t>=e.from&&t<=e.to&&e.fuel)m*=e.fuel;return m;}
function baseDemand(a,b,t){const A=CI[a],B=CI[b],d=km(a,b);let D=24*A.size*B.size*(1+0.2*(A.tour+B.tour))/Math.sqrt(Math.max(d,300)/1000);D*=Math.min(1,d/450);return D*Math.pow(1.03,t/4)*SEASON[t%4]*globalMult(t)*cityMult(t,a)*cityMult(t,b);}
const spF=P=>Math.min(1.3,Math.pow(P.speed/850,0.4));
const newF=P=>1+(P.from-1985)*0.006;
const grounded=(P,t)=>!!P.ground&&t>=P.ground[0]&&t<=P.ground[1];
const officeFee=c=>3+0.5*CI[c].size;
const isGate=(al,c)=>c===al.hq||(al.hubs||[]).includes(c);

const maxHubs=t=>Math.floor(t/12);
const hubCost=c=>20+5*CI[c].size;
function routeRule(al,a,b){const ca=ctry(a),cb=ctry(b),h=al.home,[hn,ha]=NATION[h];
  if(ca!==h&&cb!==h)return ca===cb?`Cabotage: a ${ha} airline can't fly domestic routes inside ${NATION[ca][0]}.`:`Traffic rights: a ${ha} airline's routes must start or end in ${hn}.`;
  if(!isGate(al,a)&&!isGate(al,b))return `Routes must start at your HQ${(al.hubs||[]).length?' or a hub':''}. Neither ${CI[a].name} nor ${CI[b].name} is one.`;
  return null;}
function hubMsg(al){const m=maxHubs(G.t),nx=(Math.floor(G.t/12)+1)*12;return `Hubs: ${al.hubs.length} of ${m} unlocked${nx<END_T?`, next unlocks ${qLabel(nx)}`:''}.`+(al.hubs.length<m?` Open one from a city card in ${NATION[al.home][0]}.`:'');}
function openHub(al,c){const cost=hubCost(c)+(al.slots[c]>0?0:officeFee(c));al.cash-=cost;al.hubs.push(c);al.slots[c]=(al.slots[c]||0)+Math.min(8,cityFree(c));}
function migrate(g){if(g)g.airlines.forEach(al=>{al.home=al.home||ctry(al.hq);al.hubs=al.hubs||[];al.fin=al.fin||[];});return g;}
const maxTrips=(P,d)=>Math.max(1,Math.floor(70/(2*(d/P.speed+0.75))));
const available=(P,t)=>{const y=yearOf(t);return y>=P.from&&y<=P.to;};
const cityCap=c=>6+CI[c].size*6;
const cityTaken=c=>G.airlines.reduce((s,al)=>s+(al.slots[c]||0),0);
const cityFree=c=>cityCap(c)-cityTaken(c);
const slotPrice=c=>0.12*CI[c].size*(1+G.t/80);
function usedSlots(al,c){let n=0;for(const r of al.routes)if(r.a===c||r.b===c)n+=r.freq;return n;}
function inUse(al,p){let n=0;for(const r of al.routes)if(r.plane===p)n+=r.planes;return n;}
const idle=(al,p)=>(al.fleet[p]||0)-inUse(al,p);
function assets(al){let v=0;for(const p in al.fleet)v+=al.fleet[p]*PI[p].price*RESALE;for(const c in al.slots)v+=al.slots[c]*slotPrice(c)*0.8;return v;}
const value=al=>al.cash-al.debt+assets(al);
const maxDebt=al=>150+0.4*assets(al);
const P0=()=>G.airlines[0];
function ranking(){return G.airlines.map((al,i)=>({al,i,v:al.out?-1e9:value(al)})).sort((x,y)=>y.v-x.v);}
const rankOf=al=>ranking().findIndex(x=>x.al===al)+1;

/* ---------- market simulation ---------- */
function entriesFor(a,b,excl){const k=pairKey(a,b),out=[];G.airlines.forEach((al,i)=>{if(al.out)return;for(const r of al.routes)if(r.id!==excl&&pairKey(r.a,r.b)===k)out.push({al,i,r});});return out;}
function simMarket(a,b,t,ents){
  const d=km(a,b),r=refFare(d),D0=baseDemand(a,b,t),n=ents.length,att=[],cap=[],fare=[];let sA=0,sAF=0;
  ents.forEach((e,i)=>{const P=PI[e.plane],g=grounded(P,t);fare[i]=r*e.fp/100;cap[i]=g?0:e.freq*P.seats;att[i]=g?0:Math.pow(100/e.fp,2.2)*spF(P)*newF(P)*(e.al.rep||1)*Math.sqrt(e.freq);sA+=att[i];sAF+=att[i]*fare[i];});
  const D=sA?D0*Math.pow(r/(sAF/sA),1.1):0, pax=new Array(n).fill(0);let spill=0;
  for(let i=0;i<n&&sA;i++){const want=D*att[i]/sA;pax[i]=Math.min(cap[i],want);spill+=Math.max(0,want-cap[i]);}
  spill*=0.6;let sS=0;for(let i=0;i<n;i++)if(pax[i]<cap[i])sS+=att[i];
  if(spill>0&&sS>0)for(let i=0;i<n;i++)if(pax[i]<cap[i])pax[i]=Math.min(cap[i],pax[i]+spill*att[i]/sS);
  return ents.map((e,i)=>({pax:pax[i],cap:cap[i],fare:fare[i],d,D}));
}
function econ(P,freq,planes,m,t){const rev=m.pax*2*m.fare*13/1e6,op=grounded(P,t)?0:freq*2*13*P.cpk*m.d*fuelMult(t)/1e6,up=planes*P.price*UPK;return{pax:m.pax,cap:m.cap,lf:m.cap?m.pax/m.cap:0,rev,op,up,profit:rev-op-up,fare:m.fare,demand:m.D};}
function estimate(al,inp,plan){const ents=entriesFor(inp.a,inp.b,inp.routeId).map(x=>({al:x.al,plane:x.r.plane,freq:x.r.freq,fp:x.r.fp}));ents.push({al,plane:inp.plane,freq:inp.freq,fp:inp.fp});const res=simMarket(inp.a,inp.b,G.t,ents);return econ(PI[inp.plane],inp.freq,plan.need,res[res.length-1],G.t);}

/* ---------- actions on an airline ---------- */
function planRoute(al,inp){
  const {a,b,plane,freq,routeId}=inp,P=PI[plane],ex=routeId?al.routes.find(r=>r.id===routeId):null;
  const out={d:a&&b?km(a,b):0,need:0,useIdle:0,buyPlanes:0,buyA:0,buyB:0,office:[],cost:0,trips:0,err:null};
  if(!P){out.err='No aircraft can fly this distance yet.';return out;}
  if(a===b){out.err='Pick two different cities.';return out;}
  if(out.d>P.range){out.err=`${P.name} can't fly ${fmtKm(out.d)}. Its range is ${fmtKm(P.range)}.`;return out;}
  if(!ex&&al.routes.some(r=>pairKey(r.a,r.b)===pairKey(a,b))){out.err='You already fly this route. Edit it from the Routes tab.';return out;}
  if(!ex){const rr=routeRule(al,a,b);if(rr){out.err=rr;return out;}}
  if(!ex){const hA=(al.slots[a]||0)>0,hB=(al.slots[b]||0)>0;if(!hA&&!hB){out.err='One end must be a city where you already have an office.';return out;}if(!hA)out.office.push(a);if(!hB)out.office.push(b);}
  out.trips=maxTrips(P,out.d);out.need=Math.ceil(freq/out.trips);
  const idleN=idle(al,plane)+(ex&&ex.plane===plane?ex.planes:0);
  out.buyPlanes=Math.max(0,out.need-idleN);out.useIdle=out.need-out.buyPlanes;
  const back=ex?ex.freq:0,fa=(al.slots[a]||0)-usedSlots(al,a)+back,fb=(al.slots[b]||0)-usedSlots(al,b)+back;
  out.buyA=Math.max(0,freq-fa);out.buyB=Math.max(0,freq-fb);
  out.cost=out.buyPlanes*P.price+out.buyA*slotPrice(a)+out.buyB*slotPrice(b)+out.office.reduce((x,c)=>x+officeFee(c),0);
  if(out.buyPlanes>0&&!available(P,G.t))out.err=`${P.name} is out of production. You can only use ones you already own.`;
  else if(out.buyA>cityFree(a))out.err=`${CI[a].name} has only ${cityFree(a)} free slots. Lower the weekly flights.`;
  else if(out.buyB>cityFree(b))out.err=`${CI[b].name} has only ${cityFree(b)} free slots. Lower the weekly flights.`;
  else if(out.office.some(c=>cityFree(c)<1))out.err=`${CI[out.office[0]].name} has no free slots for a new office.`;
  else if(out.cost>al.cash+1e-9)out.err=`This needs ${money(out.cost)} up front. You have ${money(al.cash)}. Borrow on the Money tab or lower the flights.`;
  return out;
}
function applyPlan(al,inp,p){
  al.cash-=p.cost;
  if(p.buyPlanes)al.fleet[inp.plane]=(al.fleet[inp.plane]||0)+p.buyPlanes;
  al.slots[inp.a]=(al.slots[inp.a]||0)+p.buyA;al.slots[inp.b]=(al.slots[inp.b]||0)+p.buyB;
  const r=inp.routeId&&al.routes.find(x=>x.id===inp.routeId);
  if(r)Object.assign(r,{plane:inp.plane,planes:p.need,freq:inp.freq,fp:inp.fp});
  else al.routes.push({id:'r'+(G.uid++),a:inp.a,b:inp.b,plane:inp.plane,planes:p.need,freq:inp.freq,fp:inp.fp,stats:null,loss:0});
}
const closeRoute=(al,id)=>{al.routes=al.routes.filter(r=>r.id!==id);};

/* ---------- rivals ---------- */
function aiBest(al){
  const flown=new Set(al.routes.map(r=>pairKey(r.a,r.b))),avail=PLANES.filter(P=>available(P,G.t)&&!grounded(P,G.t));let best=null;
  for(const o of CITIES){if(!isGate(al,o.id))continue;
    for(const c of CITIES){if(c.id===o.id||flown.has(pairKey(o.id,c.id)))continue;const d=km(o.id,c.id);
      const D=baseDemand(o.id,c.id,G.t)/(entriesFor(o.id,c.id,null).length+1);if(D<120)continue;
      for(const P of avail){if(P.range<d)continue;
        const inp={a:o.id,b:c.id,plane:P.id,freq:clamp(Math.round(D/(P.seats*0.85)),1,21),fp:al.fp};
        const plan=planRoute(al,inp);if(plan.err||plan.cost>al.cash-10)continue;
        const est=estimate(al,inp,plan),score=est.profit/(plan.cost+30)*(0.9+Math.random()*0.2);
        if(est.profit>0.6&&(!best||score>best.score))best={score,inp,plan};}}}
  return best;
}
function aiTurn(al){
  for(const r of al.routes)r.fp=al.fp;
  for(const r of [...al.routes]){if(r.loss>=2){if(r.freq>2){const inp={routeId:r.id,a:r.a,b:r.b,plane:r.plane,freq:Math.max(1,Math.floor(r.freq*0.6)),fp:r.fp},p=planRoute(al,inp);if(!p.err)applyPlan(al,inp,p);r.loss=0;}else closeRoute(al,r.id);}}
  for(const P of PLANES){let n=idle(al,P.id);while(n-->0){al.fleet[P.id]--;al.cash+=P.price*RESALE;}}
  for(const r of al.routes){if(r.stats&&r.stats.lf>0.9&&r.stats.profit>0&&r.freq<28){const inp={routeId:r.id,a:r.a,b:r.b,plane:r.plane,freq:Math.min(28,r.freq+2),fp:r.fp},p=planRoute(al,inp);if(!p.err&&p.cost<al.cash-20)applyPlan(al,inp,p);}}
  if(al.cash<40&&al.debt+50<=maxDebt(al)*0.6){al.debt+=50;al.cash+=50;}
  if(al.hubs.length<maxHubs(G.t)){const c=CITIES.filter(x=>ctry(x.id)===al.home&&!isGate(al,x.id)&&cityFree(x.id)>=4).sort((p,q)=>q.size-p.size)[0];if(c&&al.cash>hubCost(c.id)+(al.slots[c.id]>0?0:officeFee(c.id))+60){openHub(al,c.id);addNews(`${al.name} opens a hub in ${c.name}.`,'rival');}}
  for(let k=0;k<al.expand;k++){if(al.cash<20)break;const best=aiBest(al);if(!best)break;applyPlan(al,best.inp,best.plan);addNews(`${al.name} opens ${best.inp.a}–${best.inp.b}.`,'rival');}
  al.ad=al.cash>150?2:1;
  if(al.cash>300&&al.debt>0){const x=Math.min(al.debt,al.cash-200);al.debt-=x;al.cash-=x;}
}

/* ---------- game flow ---------- */
let G=null;
function startCities(hq){
  const pool=CITIES.filter(c=>c.id!==hq).map(c=>({id:c.id,d:km(hq,c.id)})),used=new Set();
  const pick=(list,n)=>{const a=list.filter(x=>!used.has(x.id)),out=[];while(out.length<n&&a.length){const x=a.splice(Math.floor(Math.random()*a.length),1)[0];out.push(x.id);used.add(x.id);}return out;};
  const st={short:pick(pool.filter(x=>x.d<1000),2),med:pick(pool.filter(x=>x.d>=1000&&x.d<2500),1),long:pick(pool.filter(x=>x.d>=2500),2)};
  const want={short:2,med:1,long:2},near={short:x=>x.d,med:x=>Math.abs(x.d-1750),long:x=>-x.d};
  for(const k in want)while(st[k].length<want[k]){const x=pool.filter(y=>!used.has(y.id)).sort((p,q)=>near[k](p)-near[k](q))[0];st[k].push(x.id);used.add(x.id);}
  return st;
}
function mkAl(name,hq,ai,pers){return{name,hq,ai,fp:pers?pers.fp:100,expand:pers?pers.expand:0,cash:250,debt:0,slots:{},start:startCities(hq),home:ctry(hq),hubs:[],fin:[],fleet:{},routes:[],ad:1,rep:1,last:null,hist:[],out:false};}
function newGame(name,hq){
  const big=CITIES.filter(c=>c.size>=6&&c.id!==hq).map(c=>c.id),rh=[];
  while(rh.length<3)rh.push(big.splice(Math.floor(Math.random()*big.length),1)[0]);
  G={t:0,uid:1,over:false,lost:false,news:[],log:[],airlines:[mkAl(name,hq,false),...rh.map((c,i)=>mkAl(RIVALS[i].name,c,true,RIVALS[i]))]};
  for(const al of G.airlines)al.slots[al.hq]=12;
  for(const al of G.airlines)for(const c of [...al.start.short,...al.start.med,...al.start.long]){const n=Math.min(4,cityFree(c));if(n>0)al.slots[c]=(al.slots[c]||0)+n;}
  G.airlines.forEach(al=>al.hist.push(value(al)));
  const st=G.airlines[0].start,nm=l=>l.map(c=>CI[c].name).join(' and ');
  addNews(`${name} is founded in ${CI[hq].name} with $250M. Starting offices: ${nm(st.short)} (short-haul), ${nm(st.med)} (medium), ${nm(st.long)} (long-haul).`,'you');
}
function addNews(text,kind){const n={t:G.t,text,kind};G.news.push(n);G.log.unshift(n);if(G.log.length>80)G.log.length=80;}
function endQuarter(){
  const t=G.t;G.news=[];
  for(const al of G.airlines)if(al.ai&&!al.out)aiTurn(al);
  const markets={};
  for(const al of G.airlines){if(al.out)continue;for(const r of al.routes){const k=pairKey(r.a,r.b);(markets[k]||(markets[k]=[])).push({al,r});}}
  for(const k in markets){const list=markets[k],[a,b]=k.split('-'),res=simMarket(a,b,t,list.map(x=>({al:x.al,plane:x.r.plane,freq:x.r.freq,fp:x.r.fp})));
    list.forEach((x,j)=>{const e=econ(PI[x.r.plane],x.r.freq,x.r.planes,res[j],t);x.r.stats={pax:Math.round(e.pax),lf:e.lf,rev:e.rev,op:e.op,up:e.up,profit:e.profit,fare:e.fare};x.r.loss=e.profit<0?(x.r.loss||0)+1:0;});}
  for(const al of G.airlines){if(al.out){al.hist.push(0);continue;}
    let rev=0,op=0,pax=0,up=0,slot=0,newSum=0,newN=0;
    for(const r of al.routes){rev+=r.stats.rev;op+=r.stats.op;pax+=r.stats.pax*26;newSum+=(PI[r.plane].from-1955)*r.planes;newN+=r.planes;}
    for(const p in al.fleet)up+=al.fleet[p]*PI[p].price*UPK;
    for(const c in al.slots)slot+=al.slots[c]*0.012*CI[c].size;
    const over=1.5+0.15*al.routes.length,ads=AD[al.ad],int=al.debt*0.015,net=rev-op-up-slot-over-ads-int;
    al.cash+=net;al.last={rev,op,up,slot,over,ads,int,net,pax};
    const target=0.85+0.08*al.ad+0.1*(newN?newSum/newN/30:0);al.rep+=(target-al.rep)*0.3;
    if(al.cash<0){const need=Math.ceil(-al.cash);
      if(al.debt+need<=maxDebt(al)){al.debt+=need;al.cash+=need;if(!al.ai)addNews(`The bank covered your ${money(need)} shortfall with an automatic loan.`,'you');}
      else{al.out=true;if(al.ai){addNews(`${al.name} goes bankrupt. Its slots return to the airports.`,'rival');al.routes=[];al.slots={};al.fleet={};}else{G.over=true;G.lost=true;}}}
    if(!al.out)(al.fin||(al.fin=[])).push({t,rev,cost:rev-net,net,cash:al.cash,debt:al.debt,pax});al.hist.push(al.out?0:value(al));}
  G.t++;
  if(G.t%12===0&&G.t<END_T)addNews(`Hub rights expand: airlines may now run ${maxHubs(G.t)} hub${maxHubs(G.t)>1?'s':''} besides their HQ.`,'you');
  for(const e of EVENTS)if(e.from===G.t&&!e.quiet)addNews(`${e.title}. ${e.text}`,'event');
  for(const e of EVENTS)if(e.to===G.t-1&&!e.quiet&&e.to<END_T-1)addNews(`${e.title} is over.`,'event');
  if(G.t%4===0)for(const P of PLANES){if(P.from===yearOf(G.t))addNews(`The ${P.name} (${P.kind.toLowerCase()}, ${P.seats} seats) is now for sale.`,'plane');if(P.to===yearOf(G.t)-1)addNews(`The ${P.name} goes out of production.`,'plane');}
  if(G.t>=END_T)G.over=true;
}

  for(let la=20;la<=50;la+=10){const [,y]=proj(0,la);s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grat)" stroke-width=".6" stroke-dasharray="2 3"/><text x="4" y="${y-3}" font-size="7" fill="var(--muted)">${la}°N</text>`;}
  s+=`<path d="${LAND_D}" fill="var(--land)" stroke="var(--coast)" stroke-width=".7" stroke-linejoin="round"/><path d="${WATER_D}" fill="var(--water)" stroke="var(--coast)" stroke-width=".6"/>`;
  for(const [lo,la] of BAHAMAS){const [x,y]=proj(lo,la);s+=`<circle cx="${x}" cy="${y}" r="1.6" fill="var(--land)" stroke="var(--coast)" stroke-width=".5"/>`;}
  s+=`<g><line x1="14" y1="372" x2="104" y2="372" stroke="var(--muted)" stroke-width="1"/><line x1="14" y1="369" x2="14" y2="375" stroke="var(--muted)"/><line x1="104" y1="369" x2="104" y2="375" stroke="var(--muted)"/><text x="14" y="365" font-size="7.5" fill="var(--muted)">1,000 km</text></g>`;
  for(let i=G.airlines.length-1;i>=0;i--){const al=G.airlines[i];if(al.out)continue;
    for(const r of al.routes){const [x1,y1]=proj(CI[r.a].lon,CI[r.a].lat),[x2,y2]=proj(CI[r.b].lon,CI[r.b].lat),mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,off=Math.min(26,L*0.12)*(i%2?-1:1)+(i?i*1.5:0);
      s+=`<path d="M${x1} ${y1}Q${mx-dy/L*off} ${my+dx/L*off} ${x2} ${y2}" fill="none" stroke="${COLORS[i]}" stroke-width="${i?0.9:1.9}" stroke-opacity="${i?0.6:0.95}" stroke-linecap="round"/>`;}}
  for(const c of CITIES){const [x,y]=proj(c.lon,c.lat),r=2+c.size*0.33,mine=(me.slots[c.id]||0)>0,hq=c.id===me.hq,hub=(me.hubs||[]).includes(c.id);

    if(hq)s+=`<rect x="${x-r-1.5}" y="${y-r-1.5}" width="${2*r+3}" height="${2*r+3}" fill="var(--accent)" stroke="var(--card)" stroke-width="1" transform="rotate(45 ${x} ${y})"/>`;
    else if(hub)s+=`<rect x="${x-r-1}" y="${y-r-1}" width="${2*r+2}" height="${2*r+2}" fill="var(--card)" stroke="var(--accent)" stroke-width="2" transform="rotate(45 ${x} ${y})"/>`;
    else s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${mine?'var(--accent)':'var(--card)'}" stroke="var(--ink)" stroke-width="${mine?0.6:1}"/>`;

/* charts */
const CH={};
function niceScale(min,max){min=Math.min(0,min);max=Math.max(0,max);if(max-min<1e-9)max=min+1;const raw=(max-min)/4,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=raw-1e-9);return{lo:Math.floor(min/step+1e-9)*step,hi:Math.ceil(max/step-1e-9)*step,step};}
function chart(id,kind,ts,series){
  const w=340,h=170,l=48,r=kind==='line'?46:10,tp=10,b=20,n=ts.length,iw=w-l-r;
  const all=series.flatMap(x=>x.vals),sc=niceScale(Math.min(...all),Math.max(...all));
  const X=i=>kind==='bar'?l+iw*(i+0.5)/n:l+(n<2?iw/2:iw*i/(n-1)),Y=v=>tp+(h-tp-b)*(sc.hi-v)/(sc.hi-sc.lo);
  CH[id]={kind,ts,series,w,X:ts.map((_,i)=>X(i))};
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(x=>x.name).join(' and '))} by quarter">`;
  for(let v=sc.lo;v<=sc.hi+1e-9;v+=sc.step)s+=`<line x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="${Math.abs(v)<1e-9?1.3:0.6}"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${Math.abs(v)<1e-9?'$0':money(v)}</text>`;
  const ny=new Set(ts.map(yearOf)).size,ys=Math.max(1,Math.ceil(ny/5));
  ts.forEach((t,i)=>{if(t%4===0&&(yearOf(t)-START)%ys===0)s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle">${yearOf(t)}</text>`;});
  if(kind==='bar'){const bw=Math.max(1.2,iw/n-2);series[0].vals.forEach((v,i)=>{const y0=Y(0),y1=Y(v);s+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.8,Math.abs(y1-y0)).toFixed(1)}" rx="${Math.min(2,bw/3).toFixed(1)}" fill="${v>=0?'var(--good)':'var(--bad)'}"/>`;});}
  else{const ends=[];series.forEach(se=>{s+=`<polyline points="${se.vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;const j=n-1;s+=`<circle cx="${X(j)}" cy="${Y(se.vals[j])}" r="3.5" fill="${se.color}" stroke="var(--card)" stroke-width="2"/>`;ends.push({y:Y(se.vals[j]),txt:se.name});});
    ends.sort((a,c)=>a.y-c.y);for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<11)ends[k].y=ends[k-1].y+11;ends.forEach(e=>{s+=`<text x="${X(n-1)+7}" y="${e.y+3}" style="fill:var(--ink)">${e.txt}</text>`;});}
  s+=`<line class="xh" x1="0" x2="0" y1="${tp}" y2="${h-b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2" visibility="hidden"/></svg>`;
  return `<div class="chartbox" data-chart="${id}">${s}<div class="tip" hidden></div></div>`;
}
function chartHover(e){
  const box=e.target.closest?e.target.closest('.chartbox'):null;
  document.querySelectorAll('.chartbox').forEach(bx=>{if(bx!==box){bx.querySelector('.tip').hidden=true;bx.querySelector('.xh').setAttribute('visibility','hidden');}});
  if(!box)return;const c=CH[box.dataset.chart];if(!c)return;
  const rc=box.querySelector('svg').getBoundingClientRect(),vx=(e.clientX-rc.left)/rc.width*c.w;
  let i=0,bd=1e9;c.X.forEach((x,k)=>{const d=Math.abs(x-vx);if(d<bd){bd=d;i=k;}});

/* rivals tab */
function chartSVG(){
  const n=Math.max(2,...G.airlines.map(a=>a.hist.length)),mx=Math.max(500,...G.airlines.flatMap(a=>a.hist));
  const raw=mx/4,mag=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(m=>m*mag).find(v=>v>=raw),top=Math.ceil(mx/step)*step,w=340,h=160,l=40,b=20,tp=8;
  const X=i=>l+(w-l-8)*i/(END_T),Y=v=>tp+(h-tp-b)*(1-Math.max(0,v)/top);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Company value over time">`;
  for(let v=0;v<=top;v+=step)s+=`<line x1="${l}" x2="${w-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${money(v)}</text>`;
  for(let y=START;y<=START+20;y+=5){const i=(y-START)*4;s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle">${y}</text>`;}
  G.airlines.forEach((al,i)=>{if(al.hist.length<1)return;const pts=al.hist.map((v,j)=>`${X(j).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${COLORS[i]}" stroke-width="${i?1.5:2.4}" stroke-linejoin="round"/>`;const j=al.hist.length-1;s+=`<circle cx="${X(j)}" cy="${Y(al.hist[j])}" r="3" fill="${COLORS[i]}"/>`;});
  return s+'</svg>';
}

function availPlanesFor(al,d){return PLANES.filter(P=>(available(P,G.t)||idle(al,P.id)>0)&&P.range>=d);}
function bestDest(al,a){let best=null,bv=-1;const maxR=Math.max(...PLANES.filter(P=>available(P,G.t)).map(P=>P.range));
  for(const c of CITIES){if(c.id===a||routeRule(al,a,c.id)||al.routes.some(r=>pairKey(r.a,r.b)===pairKey(a,c.id)))continue;const d=km(a,c.id);if(d>maxR)continue;const v=baseDemand(a,c.id,G.t)/(entriesFor(a,c.id,null).length+1);if(v>bv){bv=v;best=c.id;}}
  return best||CITIES.find(c=>c.id!==a).id;}
function autoPick(){const me=P0(),d=km(RB.a,RB.b),list=availPlanesFor(me,d);if(!list.length){RB.plane=null;return;}
  const D=baseDemand(RB.a,RB.b,G.t)/(entriesFor(RB.a,RB.b,RB.routeId).length+1);let best=null;
  for(const P of list){const freq=clamp(Math.round(D/(P.seats*0.85)),1,28),inp={...RB,plane:P.id,freq},plan=planRoute(me,inp);if(plan.need===0)continue;const est=estimate(me,inp,plan),sc=est.profit-0.05*plan.cost;if(!best||sc>best.sc)best={sc,P,freq};}
  if(best){RB.plane=best.P.id;RB.freq=best.freq;}else{RB.plane=list[0].id;RB.freq=1;}}
function openBuilder(o){

  else{RB={routeId:null,a:o.a,b:o.b||null,plane:null,freq:1,fp:100};if(!RB.b||RB.b===RB.a)RB.b=bestDest(me,RB.a);autoPick();}

}

}
function welcomeSheet(){
  openSheet(sheetHead('Welcome aboard',`${qLabel(G.t)} · ${CI[P0().hq].name}`)+`<ul class="news"><li><span class="num">0</span><span>Your starting offices: ${(()=>{const st=P0().start,f=l=>l.map(c=>`${CI[c].name} (${fmtKm(km(P0().hq,c))})`).join(', ');return `<b>short-haul</b> ${f(st.short)}; <b>medium</b> ${f(st.med)}; <b>long-haul</b> ${f(st.long)}.`})()} Opening any other city costs an office fee.</span></li><li><span class="num">·</span><span>Every route must start at your HQ for now. Hub rights expand every three years. Real traffic rules apply: no domestic routes inside a foreign country.</span></li><li><span class="num">1</span><span>Tap a city on the map, or use <b>New route</b> on the Routes tab.</span></li><li><span class="num">2</span><span>Pick a destination, an aircraft, how many round trips a week, and a fare. Planes and slots you lack are bought for you.</span></li><li><span class="num">3</span><span>Press <b>End quarter</b> to fly the schedule. Full planes earn money; empty seats cost it.</span></li><li><span class="num">4</span><span>New aircraft arrive over the years, real events shake demand, and three rivals expand every quarter.</span></li></ul><div class="actions"><button class="btn primary" data-act="close">Start flying</button></div>`,{});
}

/* events */
function handle(act,el){
  const me=G&&P0(),k=el.dataset.k;
  switch(act){
    case 'pickhq':UI.setupHQ=k;render();break;
    case 'start':{const n=($('#alname').value||'').trim()||'Contrail Air';newGame(n,UI.setupHQ);UI.tab='map';UI.mapScroll=null;save();render();welcomeSheet();break;}
    case 'resume':G=migrate(loadSave());UI.mapScroll=null;render();break;
    case 'tab':UI.tab=k;UI.confirmNew=false;render();window.scrollTo(0,0);break;
    case 'zoom':UI.zoom=!UI.zoom;UI.mapScroll=null;render();break;
    case 'city':citySheet(k);break;
    case 'close':closeSheet();break;
    case 'end':if(G.over)return;endQuarter();save();render();reportSheet();break;
    case 'hub':{const cost=hubCost(k)+(me.slots[k]>0?0:officeFee(k));if(ctry(k)===me.home&&!isGate(me,k)&&me.hubs.length<maxHubs(G.t)&&me.cash>=cost){openHub(me,k);addNews(`You open a hub in ${CI[k].name}.`,'you');save();renderHeader();citySheet(k);}break;}
    case 'fgroup':UI.fGroup=k;render();break;
    case 'fdir':UI.fDir=+k;render();break;
    case 'fshow':UI.fShow=k;render();break;
    case 'office':{const p=officeFee(k)+slotPrice(k)*2;if(!(me.slots[k]>0)&&cityFree(k)>=2&&me.cash>=p){me.cash-=p;me.slots[k]=2;addNews(`You open an office in ${CI[k].name}.`,'you');save();renderHeader();citySheet(k);}break;}
    case 'buyslots':{const n=+el.dataset.n,p=slotPrice(k)*n;if(cityFree(k)>=n&&me.cash>=p){me.cash-=p;me.slots[k]=(me.slots[k]||0)+n;save();renderHeader();citySheet(k);}break;}
    case 'routefrom':{if(isGate(me,k))openBuilder({a:k});else{const g=gates(me).filter(x=>!routeRule(me,x,k)).sort((x,y)=>(x===me.hq?-1:0)-(y===me.hq?-1:0)||km(x,k)-km(y,k));openBuilder({a:g[0]||me.hq,b:k});}break;}
    case 'newroute':openBuilder({a:me.hq});break;
    case 'editroute':openBuilder({routeId:k});break;
    case 'rb':{const d=+el.dataset.d;if(el.dataset.k==='freq')RB.freq=clamp(RB.freq+d,1,28);else RB.fp=clamp(RB.fp+d,60,160);renderBuilder();break;}
    case 'rbsave':{const plan=planRoute(me,RB);if(plan.err)return;applyPlan(me,{...RB},plan);save();UI.tab=UI.tab==='map'?'map':'routes';closeSheet();break;}
    case 'rbclose':if(!RB.confirmClose){RB.confirmClose=true;renderBuilder();}else{closeRoute(me,RB.routeId);save();closeSheet();}break;
    case 'sell':if(idle(me,k)>0){me.fleet[k]--;me.cash+=PI[k].price*RESALE;save();render();}break;
    case 'buy':if(me.cash>=PI[k].price){me.cash-=PI[k].price;me.fleet[k]=(me.fleet[k]||0)+1;save();render();}break;
    case 'ad':me.ad=+k;save();render();break;
    case 'borrow':if(me.debt+25<=maxDebt(me)){me.debt+=25;me.cash+=25;save();render();}break;
    case 'repay':{const x=Math.min(25,me.debt);if(x>0&&me.cash>=x){me.debt-=x;me.cash-=x;save();render();}break;}
    case 'newgame1':UI.confirmNew=true;render();break;
    case 'newgame0':UI.confirmNew=false;render();break;
    case 'newgame2':G=null;UI.confirmNew=false;try{localStorage.removeItem('contrail-save-v2');}catch(e){}$('#sheetRoot').innerHTML='';SHEET=null;render();window.scrollTo(0,0);break;
  }
}
function start(data){
  G=migrate((data&&data.G)||loadSave());if(data&&data.UI)Object.assign(UI,data.UI);
  document.addEventListener('click',e=>{const c=e.target.closest('[data-city]');if(c){citySheet(c.dataset.city);return;}const el=e.target.closest('[data-act]');if(el&&!el.disabled)handle(el.dataset.act,el);});
  document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.rb;if(!f||!RB)return;
    if(f==='a'){RB.a=e.target.value;if(RB.b===RB.a||routeRule(P0(),RB.a,RB.b))RB.b=bestDest(P0(),RB.a);autoPick();}
    else if(f==='b'){RB.b=e.target.value;autoPick();}
    else if(f==='plane'){RB.plane=e.target.value;}
    renderBuilder();});
  document.addEventListener('pointermove',chartHover);document.addEventListener('pointerdown',chartHover);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet();});
  window.claude?.hot?.snapshot?.(()=>({G,UI:{tab:UI.tab,zoom:UI.zoom,setupHQ:UI.setupHQ,fGroup:UI.fGroup,fDir:UI.fDir,fShow:UI.fShow}}));
  render();
}
if(typeof document!=='undefined'){window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});}
</script>

</body></html>
