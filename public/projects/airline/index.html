function returnLease(al,p){const l=oldestLease(al,p);if(!l)return;const fee=returnFee(al,p);al.cash+=(fee>0?0:l.dep)-fee;al.leases.splice(al.leases.indexOf(l),1);}
function assets(al){let v=0;for(const l of al.leases||[])v+=l.dep;for(const c in al.terms||{})v+=al.terms[c].spent*0.5;for(const p in al.fleet)v+=al.fleet[p]*PI[p].price*RESALE;for(const c in al.slots)v+=al.slots[c]*slotPrice(c)*0.8;return v;}
const value=al=>al.cash-al.debt+assets(al);
const maxDebt=al=>150+0.4*assets(al);
const P0=()=>G.airlines[0];
function ranking(){return G.airlines.map((al,i)=>({al,i,v:al.out?-1e9:value(al)})).sort((x,y)=>y.v-x.v);}
const rankOf=al=>ranking().findIndex(x=>x.al===al)+1;

/* ---------- market simulation ---------- */
function entriesFor(a,b,excl){const k=pairKey(a,b),out=[];G.airlines.forEach((al,i)=>{if(al.out)return;for(const r of al.routes)if(r.id!==excl&&pairKey(r.a,r.b)===k)out.push({al,i,r});});return out;}
function simMarket(a,b,t,ents){
  const d=km(a,b),r=refFare(d),D0=baseDemand(a,b,t),n=ents.length,att=[],cap=[],fare=[];let sA=0,sAF=0;
  ents.forEach((e,i)=>{const P=PI[e.plane],g=grounded(P,t);fare[i]=r*e.fp/100;cap[i]=g?0:e.freq*P.seats;att[i]=g?0:Math.pow(100/e.fp,2.2)*spF(P)*newF(P)*(e.al.rep||1)*loungeF(e.al,a,b)*Math.sqrt(e.freq);sA+=att[i];sAF+=att[i]*fare[i];});

  spill*=0.6;let sS=0;for(let i=0;i<n;i++)if(pax[i]<cap[i])sS+=att[i];
  if(spill>0&&sS>0)for(let i=0;i<n;i++)if(pax[i]<cap[i])pax[i]=Math.min(cap[i],pax[i]+spill*att[i]/sS);

}
function econ(P,freq,planes,m,t,rate){const rev=m.pax*2*m.fare*13/1e6,op=grounded(P,t)?0:freq*2*13*P.cpk*m.d*fuelMult(t)/1e6,up=planes*P.price*(rate??UPK);return{pax:m.pax,cap:m.cap,lf:m.cap?m.pax/m.cap:0,rev,op,up,profit:rev-op-up,fare:m.fare,demand:m.D};}
function estimate(al,inp,plan){const ents=entriesFor(inp.a,inp.b,inp.routeId).map(x=>({al:x.al,plane:x.r.plane,freq:x.r.freq,fp:x.r.fp}));ents.push({al,plane:inp.plane,freq:inp.freq,fp:inp.fp});const res=simMarket(inp.a,inp.b,G.t,ents);return econ(PI[inp.plane],inp.freq,plan.need,res[res.length-1],G.t);}

/* ---------- network simulation with connections ---------- */
function simulateAll(t,extra){
  const rep=extra&&extra.replace,stats=new Map(),markets={},rlist=new Map();
  for(const al of G.airlines){if(al.out)continue;const rs=al.routes.filter(r=>r.id!==rep);if(extra&&extra.al===al&&extra.r)rs.push(extra.r);rlist.set(al,rs);
    for(const r of rs){const k=pairKey(r.a,r.b);(markets[k]||(markets[k]=[])).push({al,r});}}
  for(const k in markets){const list=markets[k],[a,b]=k.split('-'),res=simMarket(a,b,t,list.map(x=>({al:x.al,plane:x.r.plane,freq:x.r.freq,fp:x.r.fp})));
    list.forEach((x,j)=>{const e=econ(PI[x.r.plane],x.r.freq,x.r.planes,res[j],t,x.r.rate??planeRate(x.al,x.r.plane));stats.set(x.r,{...e,local:e.pax,conn:0,connRev:0,top:[]});});}
  const ods={};
  for(const [al,rs] of rlist){const flown=new Set(rs.map(r=>pairKey(r.a,r.b)));
    for(const h of gates(al)){const legs=rs.filter(r=>(r.a===h||r.b===h)&&!grounded(PI[r.plane],t));
      for(let i=0;i<legs.length;i++)for(let j=i+1;j<legs.length;j++){const l1=legs[i],l2=legs[j],x=l1.a===h?l1.b:l1.a,y=l2.a===h?l2.b:l2.a;
        if(x===y||flown.has(pairKey(x,y)))continue;
        if(ctry(x)===ctry(y)&&ctry(x)!==al.home)continue;
        const d=km(x,y),d1=km(x,h),d2=km(h,y);if(d<300)continue;const ratio=(d1+d2)/d;if(ratio>(hasT(al,h,'conn')?2.1:1.8))continue;
        const fp=(l1.fp+l2.fp)/2;(ods[pairKey(x,y)]||(ods[pairKey(x,y)]=[])).push({al,h,l1,l2,x,y,d,d1,d2,ratio,fp,att:Math.pow(100/fp,2.2)*(al.rep||1),boost:(hasT(al,h,'conn')?1.35:1)*(hasT(al,h,'precl')&&(ctry(x)==='US'||ctry(y)==='US')?1.4:1)});}}}
  const wants=[];
  for(const k in ods){const opts=ods[k],[x,y]=k.split('-'),pool=baseDemand(x,y,t)*(markets[k]?0.15:0.45),sA=opts.reduce((q,o)=>q+o.att,0);
    for(const o of opts)wants.push({o,w:pool*o.att/sA*Math.exp(-(o.ratio-1)*2.5)*o.boost});}
  wants.sort((p,q)=>q.w-p.w);
  const flows=new Map();
  for(const {o,w} of wants){const s1=stats.get(o.l1),s2=stats.get(o.l2),n=Math.min(w,s1.cap-s1.local-s1.conn,s2.cap-s2.local-s2.conn);if(n<1)continue;
    const rev=n*2*refFare(o.d)*o.fp/100*0.85*13/1e6;
    s1.conn+=n;s2.conn+=n;s1.connRev+=rev*o.d1/(o.d1+o.d2);s2.connRev+=rev*o.d2/(o.d1+o.d2);
    const f={x:o.x,y:o.y,h:o.h,n};if(!flows.has(o.al))flows.set(o.al,[]);flows.get(o.al).push(f);s1.top.push(f);s2.top.push(f);}
  for(const v of stats.values()){v.pax=v.local+v.conn;v.lf=v.cap?v.pax/v.cap:0;v.rev+=v.connRev;v.profit+=v.connRev;}
  const own=new Map();for(const [al,rs] of rlist)own.set(al,rs.reduce((q,r)=>q+stats.get(r).profit,0));

}
const topFlows=(l,n)=>[...l].sort((p,q)=>q.n-p.n).slice(0,n).map(f=>({x:f.x,y:f.y,h:f.h,n:Math.round(f.n)}));
function estimateFull(al,inp,plan){const hr={id:'__est',a:inp.a,b:inp.b,plane:inp.plane,planes:plan.need,freq:inp.freq,fp:inp.fp,rate:plan.need?(plan.useIdle*planeRate(al,inp.plane)+plan.buyPlanes*(plan.lease?LEASE:UPK))/plan.need:UPK};
  const S1=simulateAll(G.t,{al,r:hr,replace:inp.routeId}),S0=simulateAll(G.t),e=S1.stats.get(hr);
  return {...e,net:S1.own.get(al)-S0.own.get(al),top:topFlows(e.top,3)};}
function cityPax(al,c){let all=0;for(const r of al.routes)if(r.stats&&(r.a===c||r.b===c))all+=2*r.stats.pax;const conn=2*(al.flows&&al.flows.byHub?al.flows.byHub[c]||0:0);return{total:Math.max(0,all-conn),conn};}
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const flowHTML=f=>`<span class="pair">${code(f.x)}<i>→</i>${code(f.h)}<i>→</i>${code(f.y)}</span>`;

/* ---------- actions on an airline ---------- */
const freeAt=(al,c)=>(al.slots[c]||0)-usedSlots(al,c);
function planRoute(al,inp,opt){
  const ig=opt&&opt.ignoreSlots,{a,b,plane,freq,routeId}=inp,P=PI[plane],ex=routeId?al.routes.find(r=>r.id===routeId):null;
  const out={d:a&&b?km(a,b):0,need:0,useIdle:0,buyPlanes:0,shortA:0,shortB:0,freeA:0,freeB:0,cost:0,trips:0,err:null,slotErr:null};
  if(!P){out.err='No aircraft can fly this distance yet.';return out;}
  if(a===b){out.err='Pick two different cities.';return out;}
  if(out.d>P.range){out.err=`${P.name} can't fly ${fmtKm(out.d)}. Its range is ${fmtKm(P.range)}.`;return out;}
  if(!ex&&al.routes.some(r=>pairKey(r.a,r.b)===pairKey(a,b))){out.err='You already fly this route. Edit it from the Routes tab.';return out;}
  if(!ex){const rr=routeRule(al,a,b);if(rr){out.err=rr;return out;}}
  if(plane==='a388'&&(!ex||ex.plane!==plane)&&!hasT(al,a,'wide')&&!hasT(al,b,'wide')){out.err='The A380 needs widebody gates. Build them at your HQ or a hub (terminal stage 3), then fly it from there.';return out;}
  out.trips=maxTrips(P,out.d,0.75-(hasT(al,a,'wide')?0.125:0)-(hasT(al,b,'wide')?0.125:0));out.need=Math.ceil(freq/out.trips);

  const back=ex?ex.freq:0;out.freeA=freeAt(al,a)+back;out.freeB=freeAt(al,b)+back;

  else if(!ig&&(out.shortA||out.shortB)){const c=out.shortA?a:b,n=out.shortA||out.shortB,f=Math.max(0,out.shortA?out.freeA:out.freeB);out.slotErr=c;

  else if(out.cost>al.cash+1e-9)out.err=`This needs ${money(out.cost)} up front. You have ${money(al.cash)}. Lease the planes, borrow on the Money tab, or lower the flights.`;

}
function applyPlan(al,inp,p){
  al.cash-=p.cost;
  if(p.buyPlanes){if(p.lease)leasePlane(al,inp.plane,p.buyPlanes);else al.fleet[inp.plane]=(al.fleet[inp.plane]||0)+p.buyPlanes;}
  
  const r=inp.routeId&&al.routes.find(x=>x.id===inp.routeId);
  if(r)Object.assign(r,{plane:inp.plane,planes:p.need,freq:inp.freq,fp:inp.fp});
  else al.routes.push({id:'r'+(G.uid++),a:inp.a,b:inp.b,plane:inp.plane,planes:p.need,freq:inp.freq,fp:inp.fp,stats:null,loss:0});
}
const closeRoute=(al,id)=>{al.routes=al.routes.filter(r=>r.id!==id);};

/* ---------- negotiations ---------- */
const MAX_NEGS=5,HIRE_COST=3,NEG_SALARY=0.6;
const slotsOnOffer=c=>Math.max(0,Math.min(cityFree(c),Math.floor((2+CI[c].size+Math.floor(G.t/16))*(tBuilding(c)?0.5:1))));
const relF=(al,c)=>(0.8+(al.rel[c]||10)/250)*(isGate(al,c)?1.25:1)*(hasT(al,c,'pier')?1.1:1);
const minPct=(al,c)=>Math.ceil(80/relF(al,c)/10)*10;
const freeNegs=al=>al.negs-(al.bids||[]).length;
function placeBid(al,c,n,pct){const paid=n*slotPrice(c)*pct/100;if(freeNegs(al)<1||al.bids.some(b=>b.c===c)||paid>al.cash)return false;al.cash-=paid;al.bids.push({c,n,pct,paid});return true;}
function recallBid(al,c){const b=al.bids.find(x=>x.c===c);if(!b)return;al.cash+=b.paid;al.bids=al.bids.filter(x=>x!==b);}
function resolveNegs(){
  const byCity={},me=P0(),mine=[];
  for(const al of G.airlines){if(al.out){if(al.bids)al.bids=[];continue;}for(const b of al.bids||[])(byCity[b.c]||(byCity[b.c]=[])).push({al,b});}
  for(const c in byCity){let left=slotsOnOffer(c);
    const list=byCity[c].map(x=>{const base=x.b.pct/100*relF(x.al,c);return{...x,ok:base>=0.8-1e-9,score:base*(0.88+Math.random()*0.24)};}).sort((p,q)=>q.score-p.score);
    for(const x of list){let got=0,why='';if(!x.ok)why='offer too low';else if(left<=0)why='outbid';else{got=Math.min(x.b.n,left);left-=got;}
      const per=x.b.paid/x.b.n,refund=(x.b.n-got)*per*(got?1:0.9);x.al.cash+=refund;
      if(got){x.al.slots[c]=(x.al.slots[c]||0)+got;x.al.rel[c]=Math.min(100,(x.al.rel[c]||10)+3);}
      x.got=got;x.why=why;x.refund=refund;}
    const mx=list.find(x=>x.al===me);
    if(mx)mine.push({c,n:mx.b.n,pct:mx.b.pct,got:mx.got,why:mx.why,paid:mx.b.paid-mx.refund,refund:mx.refund,rivals:list.filter(y=>y.al!==me).map(y=>({name:y.al.name,i:G.airlines.indexOf(y.al),got:y.got}))});

function updateRelations(){for(const al of G.airlines){if(al.out)continue;const serve=new Set();al.routes.forEach(r=>{serve.add(r.a);serve.add(r.b);});
  for(const c of CITIES){const v=al.rel[c.id]||10;al.rel[c.id]=serve.has(c.id)?Math.min(100,v+3+Math.min(4,cityPax(al,c.id).total/2000)):Math.max(c.id===al.hq?60:10,v-1);}}}

/* ---------- rivals ---------- */
function aiBest(al){
  const intl=al.routes.some(r=>ctry(r.a)==='GB'||ctry(r.b)==='GB'),flown=new Set(al.routes.map(r=>pairKey(r.a,r.b))),avail=PLANES.filter(P=>available(P,G.t)&&!grounded(P,G.t)),out=[];
  for(const o of CITIES){if(!isGate(al,o.id))continue;
    for(const c of CITIES){if(c.id===o.id||flown.has(pairKey(o.id,c.id)))continue;const d=km(o.id,c.id);
      const D=baseDemand(o.id,c.id,G.t)/(entriesFor(o.id,c.id,null).length+1);if(D<120)continue;let best=null;
      for(const P of avail){if(P.range<d)continue;
        const inp={a:o.id,b:c.id,plane:P.id,freq:clamp(Math.round(D/(P.seats*0.85)),1,21),fp:al.fp};
        let plan=planRoute(al,inp,{ignoreSlots:true});if(!plan.err&&plan.cost>al.cash*0.5){inp.acq='lease';plan=planRoute(al,inp,{ignoreSlots:true});}if(plan.err||plan.cost>al.cash-10)continue;
        const est=estimate(al,inp,plan),score=est.profit/(plan.cost+30)*(0.9+Math.random()*0.2)*(freeAt(al,c.id)>0?1.3:1)*(ctry(c.id)!==ctry(o.id)&&ctry(c.id)==='GB'&&!intl?1.8:1);
        if(est.profit>0.6&&(!best||score>best.score))best={score,inp};}

function aiTurn(al){

  for(const r of al.routes)r.fp=al.fp;
  for(const r of [...al.routes]){if(r.loss>=2){if(r.freq>2){const inp={routeId:r.id,a:r.a,b:r.b,plane:r.plane,freq:Math.max(1,Math.floor(r.freq*0.6)),fp:r.fp},p=planRoute(al,inp);if(!p.err)applyPlan(al,inp,p);r.loss=0;}else closeRoute(al,r.id);}}

  if(al.hubs.length<maxHubs(G.t)){const c=CITIES.filter(x=>ctry(x.id)===al.home&&!isGate(al,x.id)&&(al.slots[x.id]||0)>0).sort((p,q)=>q.size-p.size)[0];if(c&&al.cash>hubCost(c.id)+60){openHub(al,c.id);addNews(`${al.name} opens a hub in ${c.name}.`,'rival');}}
  {const c=gates(al).find(x=>{const T=al.terms[x];const st=stagesFor(x)[T?T.stage:0];return st&&!(T&&T.build)&&al.routes.filter(r=>r.a===x||r.b===x).length>=4&&al.cash>st.cost(x)+150;});if(c)buildTerminal(al,c);}

/* ---------- game flow ---------- */
let G=null;
function startCities(hq){
  const pool=CITIES.filter(c=>c.id!==hq&&ctry(c.id)!=='GB').map(c=>({id:c.id,d:km(hq,c.id)})),used=new Set();
  const pick=(list,n)=>{const a=list.filter(x=>!used.has(x.id)),out=[];while(out.length<n&&a.length){const x=a.splice(Math.floor(Math.random()*a.length),1)[0];out.push(x.id);used.add(x.id);}return out;};
  const st={short:pick(pool.filter(x=>x.d<1000),2),med:pick(pool.filter(x=>x.d>=1000&&x.d<2500),1),long:pick(pool.filter(x=>x.d>=2500),2)};
  const want={short:2,med:1,long:2},near={short:x=>x.d,med:x=>Math.abs(x.d-1750),long:x=>-x.d};
  for(const k in want)while(st[k].length<want[k]){const x=pool.filter(y=>!used.has(y.id)).sort((p,q)=>near[k](p)-near[k](q))[0];st[k].push(x.id);used.add(x.id);}
  return st;
}
function mkAl(name,hq,ai,pers){return{name,hq,ai,fp:pers?pers.fp:100,expand:pers?pers.expand:0,cash:250,debt:0,slots:{},start:startCities(hq),home:ctry(hq),hubs:[],fin:[],leases:[],negs:2,bids:[],rel:{},bidPct:pers?pers.bid:100,fleet:{},terms:{},routes:[],ad:1,rep:1,last:null,hist:[],out:false};}
function newGame(name,hq){
  const big=CITIES.filter(c=>c.size>=6&&c.id!==hq).map(c=>c.id),rh=[];
  while(rh.length<3)rh.push(big.splice(Math.floor(Math.random()*big.length),1)[0]);
  G={t:0,uid:1,capBonus:{},lastCap:{},over:false,lost:false,news:[],log:[],airlines:[mkAl(name,hq,false),...rh.map((c,i)=>mkAl(RIVALS[i].name,c,true,RIVALS[i]))]};
  for(const al of G.airlines){al.slots[al.hq]=Math.min(24,cityFree(al.hq));al.rel[al.hq]=80;}
  for(const al of G.airlines)for(const c of [...al.start.short,...al.start.med,...al.start.long]){const n=Math.min(6,cityFree(c));if(n>0){al.slots[c]=(al.slots[c]||0)+n;al.rel[c]=Math.max(al.rel[c]||0,40);}}
  G.airlines.forEach(al=>al.hist.push(value(al)));
  const st=G.airlines[0].start,nm=l=>l.map(c=>CI[c].name).join(' and ');
  addNews(`${name} is founded in ${CI[hq].name} with $250M. Starting offices: ${nm(st.short)} (short-haul), ${nm(st.med)} (medium), ${nm(st.long)} (long-haul).`,'you');

function addNews(text,kind){const n={t:G.t,text,kind};G.news.push(n);G.log.unshift(n);if(G.log.length>80)G.log.length=80;}
function endQuarter(){
  const t=G.t;G.news=[];
  for(const al of G.airlines)if(al.ai&&!al.out)aiTurn(al);
  resolveNegs();
  const S=simulateAll(t);
  for(const al of G.airlines){if(al.out)continue;
    for(const r of al.routes){const e=S.stats.get(r);r.stats={pax:Math.round(e.pax),local:Math.round(e.local),conn:Math.round(e.conn),lf:e.lf,rev:e.rev,op:e.op,up:e.up,profit:e.profit,fare:e.fare,top:topFlows(e.top,3)};r.loss=e.profit<0?(r.loss||0)+1:0;}
    const fl=S.flows.get(al)||[],byHub={};fl.forEach(f=>byHub[f.h]=(byHub[f.h]||0)+f.n);for(const h in byHub)byHub[h]=Math.round(byHub[h]);
    al.flows={total:Math.round(fl.reduce((q,f)=>q+f.n,0)),top:topFlows(fl,10),byHub};}
  for(const al of G.airlines){if(al.out){al.hist.push(0);continue;}
    let rev=0,op=0,pax=0,up=0,slot=0,newSum=0,newN=0;
    for(const r of al.routes){rev+=r.stats.rev;op+=r.stats.op;pax+=(r.stats.local??r.stats.pax)*26;newSum+=(PI[r.plane].from-1955)*r.planes;newN+=r.planes;}pax+=(al.flows?al.flows.total:0)*26;
    for(const p in al.fleet)up+=al.fleet[p]*PI[p].price*UPK;let lease=0;for(const l of al.leases||[])lease+=PI[l.p].price*LEASE;
    for(const c in al.slots)slot+=al.slots[c]*0.004*CI[c].size*(hasT(al,c,'pier')?0.5:1);
    const over=1.5+0.15*al.routes.length,ads=AD[al.ad],int=al.debt*0.015,staff=(al.negs||0)*NEG_SALARY,net=rev-op-up-lease-slot-over-ads-int-staff;
    al.cash+=net;al.last={rev,op,up,lease,slot,over,ads,int,staff,net,pax};
    const target=0.85+0.08*al.ad+0.1*(newN?newSum/newN/30:0);al.rep+=(target-al.rep)*0.3;
    if(al.cash<0){const need=Math.ceil(-al.cash);
      if(al.debt+need<=maxDebt(al)){al.debt+=need;al.cash+=need;if(!al.ai)addNews(`The bank covered your ${money(need)} shortfall with an automatic loan.`,'you');}
      else{al.out=true;if(al.ai){addNews(`${al.name} goes bankrupt. Its slots return to the airports.`,'rival');al.routes=[];al.slots={};al.fleet={};al.leases=[];}else{G.over=true;G.lost=true;}}}
    if(!al.out)(al.fin||(al.fin=[])).push({t,rev,cost:rev-net,net,cash:al.cash,debt:al.debt,pax});al.hist.push(al.out?0:value(al));}
  updateRelations();
  {const me0=P0();for(const c of CITIES){const cap=cityCap(c.id),last=G.lastCap[c.id]??cap;
    if(cap>last)for(const al of G.airlines){if(al.out||!hasT(al,c.id,'pier'))continue;const n=Math.min(2,cityFree(c.id));if(n>0){al.slots[c.id]=(al.slots[c.id]||0)+n;if(al===me0)addNews(`${CI[c.id].name} adds capacity. Your pier there earns you ${n} free slot${n>1?'s':''}.`,'you');}}
    G.lastCap[c.id]=cap;}
  for(const al of G.airlines){if(al.out)continue;for(const c in al.terms){const T=al.terms[c];if(T.build&&T.build.done<=G.t+1){const st=stagesFor(c)[T.stage];T.stage++;T.build=null;
      if(st.k==='pier'){G.capBonus[c]=(G.capBonus[c]||0)+8;G.lastCap[c]=(G.lastCap[c]||cityCap(c))+8;al.slots[c]=(al.slots[c]||0)+Math.max(0,Math.min(4,cityFree(c)));}
      addNews(al===me0?`Construction finished: ${st.name} at ${CI[c].name}.`:`${al.name} finishes building ${st.name.replace(/^[A-Z](?=[a-z])/,m=>m.toLowerCase())} at ${CI[c].name}.`,al===me0?'you':'rival');}}}}
  G.t++;
  if(G.t%12===0&&G.t<END_T)addNews(`Hub rights expand: airlines may now run ${maxHubs(G.t)} hub${maxHubs(G.t)>1?'s':''} besides their HQ.`,'you');
  for(const e of EVENTS)if(e.from===G.t&&!e.quiet)addNews(`${e.title}. ${e.text}`,'event');
  for(const e of EVENTS)if(e.to===G.t-1&&!e.quiet&&e.to<END_T-1)addNews(`${e.title} is over.`,'event');
  if(G.t%4===0)for(const P of PLANES){if(P.from===yearOf(G.t))addNews(`The ${P.name} (${P.kind.toLowerCase()}, ${P.seats} seats) is now for sale.`,'plane');if(P.to===yearOf(G.t)-1)addNews(`The ${P.name} goes out of production.`,'plane');}
  if(G.t>=END_T)G.over=true;
}

      let plan=planRoute(me,inp,{ignoreSlots:true});if(plan.err)continue;if(plan.cost>me.cash*0.6){inp.acq='lease';plan=planRoute(me,inp,{ignoreSlots:true});if(plan.err)continue;}

    if(r.fp<=150)opts.push({...base,fp:r.fp+10,kind:'fareUp'});if(r.fp>=70)opts.push({...base,fp:r.fp-10,kind:'fareDown'});
    opts.push({...base,freq:r.freq+2,kind:'more'});if(r.freq>2)opts.push({...base,freq:r.freq-2,kind:'fewer'});

  const shared=me.routes.filter(r=>entriesFor(r.a,r.b,r.id).length).length;

    if(hc)M.plan.push({ic:'route',main:`Open a hub in ${hc.name}`,sub:`You can run ${maxHubs(G.t)-me.hubs.length} more hub${maxHubs(G.t)-me.hubs.length>1?'s':''}. ${hc.name} is your biggest home-country city that isn't one yet. Routes could start there and passengers could connect.`,act:me.cash>=hubCost(hc.id)?{label:`Make hub · ${money(hubCost(hc.id))}`,fn:()=>{openHub(me,hc.id);addNews(`You open a hub in ${hc.name}.`,'you');return 1;}}:null});}
  {const g=gates(me).map(c=>({c,n:me.routes.filter(r=>r.a===c||r.b===c).length,T:me.terms[c]})).filter(x=>x.n>=3&&!(x.T&&x.T.build)).sort((a,b)=>b.n-a.n)[0];
    if(g){const st=stagesFor(g.c)[g.T?g.T.stage:0];if(st&&me.cash>st.cost(g.c)+50)M.plan.push({ic:'build',main:`Build a ${st.name.replace(/^[A-Z](?=[a-z])/,m=>m.toLowerCase())} at ${CI[g.c].name}`,sub:`${g.n} of your routes use ${CI[g.c].name}. ${st.desc}`,act:{label:`Build · ${money(st.cost(g.c))}`,fn:()=>{buildTerminal(me,g.c);addNews(`Construction starts: ${st.name} at ${CI[g.c].name}.`,'you');return 1;}}});}}
  for(const c in me.slots){const f=freeAt(me,c);if(f>=8&&!isGate(me,c)){M.plan.push({ic:'info',main:`${f} unused slots at ${CI[c].name}`,sub:`They cost ${money(f*0.004*CI[c].size)} a quarter. Fly more there, or return some on the Slots tab.`,act:{label:'Open Slots tab',fn:()=>{UI.tab='slots';closeSheet();return 0;}}});break;}}
  return M;
}
function tweakText(t){const {o,res,r}=t,P=PI[r.plane],pl=res.plan,Q=PI[o.plane];
  switch(o.kind){case 'fareUp':return `Raise the fare to $${fareOf(r.a,r.b,o.fp)} (${o.fp}% of standard)`;
    case 'fareDown':return `Cut the fare to $${fareOf(r.a,r.b,o.fp)} (${o.fp}% of standard)`;

function routeWhy(r){const s=r.stats,bits=[`${Math.round(s.lf*100)}% full`,`${sgn(s.profit)} last quarter`];if(r.loss>=2)bits.push(`lost money ${r.loss} quarters running`);

function meetingSheet(keep){

/* charts */
const CH={};
function niceScale(min,max){min=Math.min(0,min);max=Math.max(0,max);if(max-min<1e-9)max=min+1;const raw=(max-min)/4,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=raw-1e-9);return{lo:Math.floor(min/step+1e-9)*step,hi:Math.ceil(max/step-1e-9)*step,step};}
function chart(id,kind,ts,series){
  const w=340,h=170,l=48,r=kind==='line'?46:10,tp=10,b=20,n=ts.length,iw=w-l-r;
  const all=series.flatMap(x=>x.vals),sc=niceScale(Math.min(...all),Math.max(...all));
  const X=i=>kind==='bar'?l+iw*(i+0.5)/n:l+(n<2?iw/2:iw*i/(n-1)),Y=v=>tp+(h-tp-b)*(sc.hi-v)/(sc.hi-sc.lo);
  CH[id]={kind,ts,series,w,X:ts.map((_,i)=>X(i))};
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(x=>x.name).join(' and '))} by quarter">`;
  for(let v=sc.lo;v<=sc.hi+1e-9;v+=sc.step)s+=`<line x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="${Math.abs(v)<1e-9?1.3:0.6}"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${Math.abs(v)<1e-9?'$0':money(v)}</text>`;
  const ny=new Set(ts.map(yearOf)).size,ys=Math.max(1,Math.ceil(ny/5));
  ts.forEach((t,i)=>{if(t%4===0&&(yearOf(t)-START)%ys===0)s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle">${yearOf(t)}</text>`;});
  if(kind==='bar'){const bw=Math.max(1.2,iw/n-2);series[0].vals.forEach((v,i)=>{const y0=Y(0),y1=Y(v);s+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.8,Math.abs(y1-y0)).toFixed(1)}" rx="${Math.min(2,bw/3).toFixed(1)}" fill="${v>=0?'var(--good)':'var(--bad)'}"/>`;});}
  else{const ends=[];series.forEach(se=>{s+=`<polyline points="${se.vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;const j=n-1;s+=`<circle cx="${X(j)}" cy="${Y(se.vals[j])}" r="3.5" fill="${se.color}" stroke="var(--card)" stroke-width="2"/>`;ends.push({y:Y(se.vals[j]),txt:se.name});});
    ends.sort((a,c)=>a.y-c.y);for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<11)ends[k].y=ends[k-1].y+11;ends.forEach(e=>{s+=`<text x="${X(n-1)+7}" y="${e.y+3}" style="fill:var(--ink)">${e.txt}</text>`;});}
  s+=`<line class="xh" x1="0" x2="0" y1="${tp}" y2="${h-b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2" visibility="hidden"/></svg>`;
  return `<div class="chartbox" data-chart="${id}">${s}<div class="tip" hidden></div></div>`;
}
function chartHover(e){
  const box=e.target.closest?e.target.closest('.chartbox'):null;
  document.querySelectorAll('.chartbox').forEach(bx=>{if(bx!==box){bx.querySelector('.tip').hidden=true;bx.querySelector('.xh').setAttribute('visibility','hidden');}});
  if(!box)return;const c=CH[box.dataset.chart];if(!c)return;
  const rc=box.querySelector('svg').getBoundingClientRect(),vx=(e.clientX-rc.left)/rc.width*c.w;
  let i=0,bd=1e9;c.X.forEach((x,k)=>{const d=Math.abs(x-vx);if(d<bd){bd=d;i=k;}});
  const xh=box.querySelector('.xh');xh.setAttribute('x1',c.X[i]);xh.setAttribute('x2',c.X[i]);xh.setAttribute('visibility','visible');
  const tip=box.querySelector('.tip');
  tip.innerHTML=`<span class="lbl">${qLabel(c.ts[i])}</span>`+c.series.map(se=>`<span>${se.color?`<span class="dot" style="background:${se.color}"></span> `:''}${se.name} <b>${c.kind==='bar'?sgn(se.vals[i]):money(se.vals[i])}</b></span>`).join('');
  tip.hidden=false;const px=c.X[i]/c.w*rc.width,tw=tip.offsetWidth;tip.style.left=Math.max(0,px+12+tw>rc.width?px-tw-12:px+12)+'px';
}
function moneyCharts(me){

  const leg=l=>`<div class="legend">${l.map(([n,c])=>`<span><span class="dot" style="background:${c}"></span>${n}</span>`).join('')}</div>`;

function chartSVG(){

  const raw=mx/4,mag=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(m=>m*mag).find(v=>v>=raw),top=Math.ceil(mx/step)*step,w=340,h=160,l=40,b=20,tp=8;
  const X=i=>l+(w-l-8)*i/(END_T),Y=v=>tp+(h-tp-b)*(1-Math.max(0,v)/top);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Company value over time">`;
  for(let v=0;v<=top;v+=step)s+=`<line x1="${l}" x2="${w-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${money(v)}</text>`;
  for(let y=START;y<=START+20;y+=5){const i=(y-START)*4;s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle">${y}</text>`;}
  G.airlines.forEach((al,i)=>{if(al.hist.length<1)return;const pts=al.hist.map((v,j)=>`${X(j).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${COLORS[i]}" stroke-width="${i?1.5:2.4}" stroke-linejoin="round"/>`;const j=al.hist.length-1;s+=`<circle cx="${X(j)}" cy="${Y(al.hist[j])}" r="3" fill="${COLORS[i]}"/>`;});

function availPlanesFor(al,d){return PLANES.filter(P=>(available(P,G.t)||idle(al,P.id)>0)&&P.range>=d);}
function bestDest(al,a){let best=null,bv=-1;const maxR=Math.max(...PLANES.filter(P=>available(P,G.t)).map(P=>P.range));
  for(const c of CITIES){if(c.id===a||routeRule(al,a,c.id)||al.routes.some(r=>pairKey(r.a,r.b)===pairKey(a,c.id)))continue;const d=km(a,c.id);if(d>maxR)continue;const v=baseDemand(a,c.id,G.t)/(entriesFor(a,c.id,null).length+1)*(freeAt(al,c.id)>0?1:0.05);if(v>bv){bv=v;best=c.id;}}
  return best||CITIES.find(c=>c.id!==a).id;}
function autoPick(){const me=P0(),d=km(RB.a,RB.b),list=availPlanesFor(me,d);if(!list.length){RB.plane=null;return;}
  const D=baseDemand(RB.a,RB.b,G.t)/(entriesFor(RB.a,RB.b,RB.routeId).length+1);let best=null;
  for(const P of list){const freq=clamp(Math.round(D/(P.seats*0.85)),1,28),inp={...RB,plane:P.id,freq},plan=planRoute(me,inp);if(plan.need===0)continue;const est=estimate(me,inp,plan),sc=est.profit-0.05*plan.cost;if(!best||sc>best.sc)best={sc,P,freq};}
  if(best){RB.plane=best.P.id;RB.freq=best.freq;const fr=Math.min(freeAt(me,RB.a),freeAt(me,RB.b));if(fr>0)RB.freq=Math.min(RB.freq,fr);}else{RB.plane=list[0].id;RB.freq=1;}}
function openBuilder(o){
  const me=P0();
  if(o.routeId){const r=me.routes.find(x=>x.id===o.routeId);RB={routeId:r.id,a:r.a,b:r.b,plane:r.plane,freq:r.freq,fp:r.fp,acq:'buy',confirmClose:false};}
  else{RB={routeId:null,a:o.a,b:o.b||null,plane:null,freq:1,fp:100,acq:'buy'};if(!RB.b||RB.b===RB.a)RB.b=bestDest(me,RB.a);autoPick();}

}

  ${est?`<div class="forecast"><div class="kv"><span class="lbl">Pax / week each way</span><b>${Math.round(est.pax)}</b>${est.conn>=1?`<span class="muted" style="font-size:12px">${Math.round(est.local)} local + ${Math.round(est.conn)} connecting</span>`:''}</div><div class="kv"><span class="lbl">Load factor</span><b>${Math.round(est.lf*100)}%</b></div><div class="kv"><span class="lbl">Route profit / qtr</span><b class="${cls(est.profit)}">${sgn(est.profit)}</b></div><div class="kv"><span class="lbl">Network change / qtr</span><b class="${cls(est.net)}">${sgn(est.net)}</b></div></div>
  ${est.top.length?`<div class="field"><span class="lbl">Top connections on this route</span><div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px">${est.top.map(f=>`<span>${flowHTML(f)} <span class="num">${Math.round(f.n)}</span></span>`).join('')}</div></div>`:''}

function handle(act,el){
  const me=G&&P0(),k=el.dataset.k;
  switch(act){
    case 'pickhq':UI.setupHQ=k;render();break;
    case 'start':{const n=($('#alname').value||'').trim()||'My Airline';newGame(n,UI.setupHQ);G.color=UI.setupColor||'magenta';UI.tab='map';UI.mapScroll=null;save();render();welcomeSheet();break;}
    case 'resume':G=migrate(loadSave());UI.mapScroll=null;render();break;
    case 'tab':UI.tab=k;UI.confirmNew=false;render();window.scrollTo(0,0);break;
    case 'zoom':UI.zoom=!UI.zoom;UI.mapScroll=null;render();break;
    case 'city':citySheet(k);break;
    case 'close':closeSheet();break;
    case 'end':if(G.over)return;endQuarter();save();render();reportSheet();break;
    case 'hub':{const cost=hubCost(k);if(me.slots[k]>0&&ctry(k)===me.home&&!isGate(me,k)&&me.hubs.length<maxHubs(G.t)&&me.cash>=cost){openHub(me,k);addNews(`You open a hub in ${CI[k].name}.`,'you');save();renderHeader();citySheet(k);}break;}
    case 'nb':{const d=+el.dataset.d;if(el.dataset.k==='n')NB.n=clamp(NB.n+d,1,10);else NB.pct=clamp(NB.pct+d,50,250);citySheet(NB.c,1);break;}
    case 'sendneg':if(placeBid(me,k,NB.n,NB.pct)){save();renderHeader();citySheet(k,1);}break;
    case 'recall':recallBid(me,k);save();renderHeader();if(SHEET&&SHEET.city)citySheet(k,1);else render();break;
    case 'hire':if(me.negs<MAX_NEGS&&me.cash>=HIRE_COST){me.negs++;me.cash-=HIRE_COST;save();render();}break;
    case 'fire':if(me.negs>1&&freeNegs(me)>0){me.negs--;save();render();}break;
    case 'retslot':{const n=me.slots[k]||0;if(freeAt(me,k)>0&&!(isGate(me,k)&&n<=1)){me.slots[k]=n-1;me.cash+=slotPrice(k)*0.5;if(!me.slots[k])delete me.slots[k];save();render();}break;}
    case 'negfrom':RB=null;citySheet(k);break;
    case 'tbuild':if(buildTerminal(me,k)){addNews(`Construction starts: ${stagesFor(k)[me.terms[k].stage].name} at ${CI[k].name}.`,'you');save();renderHeader();citySheet(k,1);}break;
    case 'color':if(G){G.color=k;save();}else UI.setupColor=k;render();break;
    case 'meeting':meetingSheet();break;
    case 'mtg':{const f=MTG&&MTG.acts[+k];if(f){const again=f();save();renderHeader();if(again)meetingSheet(1);}break;}
    case 'rhub':UI.routeHub=k||null;render();break;
    case 'csort':UI.citySort=k;render();break;
    case 'fgroup':UI.fGroup=k;render();break;
    case 'fdir':UI.fDir=+k;render();break;
    case 'fshow':UI.fShow=k;render();break;
    case 'office':{const p=officeFee(k)+slotPrice(k)*2;if(!(me.slots[k]>0)&&cityFree(k)>=2&&me.cash>=p){me.cash-=p;me.slots[k]=2;addNews(`You open an office in ${CI[k].name}.`,'you');save();renderHeader();citySheet(k);}break;}
    case 'buyslots':{const n=+el.dataset.n,p=slotPrice(k)*n;if(cityFree(k)>=n&&me.cash>=p){me.cash-=p;me.slots[k]=(me.slots[k]||0)+n;save();renderHeader();citySheet(k);}break;}
    case 'routefrom':{if(isGate(me,k))openBuilder({a:k});else{const g=gates(me).filter(x=>!routeRule(me,x,k)).sort((x,y)=>(x===me.hq?-1:0)-(y===me.hq?-1:0)||km(x,k)-km(y,k));openBuilder({a:g[0]||me.hq,b:k});}break;}
    case 'newroute':openBuilder({a:me.hq});break;
    case 'editroute':openBuilder({routeId:k});break;
    case 'rb':{const d=+el.dataset.d;if(el.dataset.k==='freq')RB.freq=clamp(RB.freq+d,1,28);else RB.fp=clamp(RB.fp+d,60,160);renderBuilder();break;}
    case 'acq':RB.acq=k;renderBuilder();break;
    case 'rbsave':{const plan=planRoute(me,RB);if(plan.err)return;applyPlan(me,{...RB},plan);save();UI.tab=UI.tab==='map'?'map':'routes';closeSheet();break;}
    case 'rbclose':if(!RB.confirmClose){RB.confirmClose=true;renderBuilder();}else{closeRoute(me,RB.routeId);save();closeSheet();}break;
    case 'lease':{const P=PI[k];if(me.cash>=P.price*LEASE&&available(P,G.t)){me.cash-=P.price*LEASE;leasePlane(me,k,1);save();render();}break;}
    case 'retlease':if(idle(me,k)>0&&leasedCount(me,k)){returnLease(me,k);save();render();}break;
    case 'sell':if(idle(me,k)>0&&me.fleet[k]>0){me.fleet[k]--;me.cash+=PI[k].price*RESALE;save();render();}break;
    case 'buy':if(me.cash>=PI[k].price&&available(PI[k],G.t)){me.cash-=PI[k].price;me.fleet[k]=(me.fleet[k]||0)+1;save();render();}break;
    case 'ad':me.ad=+k;save();render();break;
    case 'borrow':if(me.debt+25<=maxDebt(me)){me.debt+=25;me.cash+=25;save();render();}break;
    case 'repay':{const x=Math.min(25,me.debt);if(x>0&&me.cash>=x){me.debt-=x;me.cash-=x;save();render();}break;}
    case 'newgame1':UI.confirmNew=true;render();break;
    case 'newgame0':UI.confirmNew=false;render();break;
    case 'newgame2':G=null;UI.confirmNew=false;try{localStorage.removeItem('airline-save-v2');}catch(e){}$('#sheetRoot').innerHTML='';SHEET=null;render();window.scrollTo(0,0);break;
  }
}
function start(data){
  G=migrate((data&&data.G)||loadSave());if(data&&data.UI)Object.assign(UI,data.UI);
  document.addEventListener('click',e=>{const c=e.target.closest('[data-city]');if(c){citySheet(c.dataset.city);return;}const el=e.target.closest('[data-act]');if(el&&!el.disabled)handle(el.dataset.act,el);});
  document.addEventListener('input',e=>{if(e.target.id==='alname')UI.setupName=e.target.value;});
  document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.rb;if(!f||!RB)return;
    if(f==='a'){RB.a=e.target.value;if(RB.b===RB.a||routeRule(P0(),RB.a,RB.b))RB.b=bestDest(P0(),RB.a);autoPick();}
    else if(f==='b'){RB.b=e.target.value;autoPick();}
    else if(f==='plane'){RB.plane=e.target.value;}
    renderBuilder();});
  document.addEventListener('pointermove',chartHover);document.addEventListener('pointerdown',chartHover);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet();});
  window.claude?.hot?.snapshot?.(()=>({G,UI:{routeHub:UI.routeHub,citySort:UI.citySort,tab:UI.tab,zoom:UI.zoom,setupHQ:UI.setupHQ,fGroup:UI.fGroup,fDir:UI.fDir,fShow:UI.fShow}}));
  render();
}
if(typeof document!=='undefined'){window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});}
</script>
